<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Jasmine Printer - Forgotten Hobbies</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <!-- commenting 
        <h1>JavaScript and C# test</h1>

        <div class="widget-wrapper">
        <!-- The emerging receipt scroll -->
         <div class="receipt-slot">
                <div class="receipt" id="receipt">
                    <img src="public/Pixel-Art Curled Receipt Scroll.png" alt="Receipt" class="receipt-bg">
                    <div class="receipt-content">
                        <div class="receipt-header">
                            ✿ FORGOTTEN HOBBIES ✿
                        </div>
                            <ul id="hobby-list" class="hobby-list">
                                <!-- JavaScript will inject items here-->
                            </ul>
                    </div>
                </div>
            </div>
            <!-- The printer body in front -->
            <div class="printer" id="printer">
                <img src="public/Pastel Pink Pixel Art Printer.png" alt="Pixel Pink Printer" class="printer-img">
            </div>    
            <!-- The printer body in front, cropped -->
            <div class="printer-front" id="printer-front">
                <img src="public/front of printer.png" alt="Printer Front Cropped" class="printer-front-img">
            </div>
        </div>
    <script src="test.js"></script>
</body>
</html>
